name: license integrity

# Every public, non-archived repo in opena2a-org and opena2a-standards must
# classify Apache-2.0 on GitHub, unless LICENSE-ALLOWLIST.tsv carries the repo
# with its allowed SPDX id and a reason. Weekly and on demand; NOASSERTION (a
# rewritten text) and NONE (no file) are findings like any other id, so a
# licence regression cannot accrue silently.
#
# Each finding is tracked as one open issue in this repository (bot-authored,
# labeled `license-integrity`), updated on every run and never duplicated. The
# run fails on a finding no open bot issue tracks, on a tracked finding older
# than 30 days, on an issue write that fails, and on an organization that
# cannot be enumerated; it passes when every finding is tracked and young, and
# its summary then lists each finding with its issue URL. Details, invariants
# and the exit rules: scripts/license-integrity.sh.

on:
  schedule:
    - cron: "43 6 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Read everything, write nothing (no issues, labels or comments)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Every public repo classifies Apache-2.0 or is allowlisted with a reason, or is tracked by an open issue
        env:
          GH_TOKEN: ${{ secrets.ORG_READ_TOKEN || github.token }}
          ISSUES_TOKEN: ${{ github.token }}
          ISSUE_REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '0' }}
        run: bash scripts/license-integrity.sh
